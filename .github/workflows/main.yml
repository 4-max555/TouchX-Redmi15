
name: Build TouchX Redmi 15 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          test -f TouchX-Redmi15-source.zip
          mkdir -p redmi15_build
          unzip -q TouchX-Redmi15-source.zip -d redmi15_build
          test -f redmi15_build/TouchX-Redmi15/settings.gradle
          test -f redmi15_build/TouchX-Redmi15/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: redmi15_build/TouchX-Redmi15
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchX-Redmi15-APK
          path: redmi15_build/TouchX-Redmi15/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
